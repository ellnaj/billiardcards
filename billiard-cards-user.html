<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Billiard Card Game — Player</title>
<style>
  :root{
    --bg:#0e1210; --panel:#161b18; --felt:#1f6d3f; --felt-light:#2c8a52;
    --gold:#d4af37; --white:#f5f5f0; --red:#d13c3c; --black:#1a1a1a; --muted:#8a9490;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden;}
  .app{max-width:480px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px;}
  header{text-align:center;}
  header h1{margin:0;font-size:1.3rem;letter-spacing:1px;color:var(--felt-light);}
  header p{margin:2px 0 0;font-size:.7rem;color:var(--muted);letter-spacing:2px;}
  .panel{background:var(--panel);border:1px solid #262e29;border-radius:14px;padding:14px;}
  .section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:16px;font-size:1.05rem;font-weight:700;letter-spacing:.5px;cursor:pointer;text-align:center;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--felt);color:var(--white);}
  .btn-secondary{flex:1;background:#232a25;color:var(--white);padding:12px;border-radius:10px;border:1px solid #303a33;font-size:.85rem;font-weight:600;cursor:pointer;}

  .balls-rack{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .ball{position:relative;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:var(--white);cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.15);}
  .ball .num{background:#fff;color:#111;border-radius:50%;width:58%;height:58%;display:flex;align-items:center;justify-content:center;}
  .ball.sunk{opacity:.25;filter:grayscale(1);cursor:default;}
  .ball.stripe{background:linear-gradient(#fff 30%, var(--bc) 30%, var(--bc) 70%, #fff 70%);}
  .ball.solid{background:var(--bc);}

  .players-list{display:flex;flex-direction:column;gap:8px;}
  .player-row{display:flex;align-items:center;justify-content:space-between;background:#10140f;border:1px solid #262e29;border-radius:10px;padding:10px 12px;}
  .player-row.winner{border-color:var(--gold);background:#1c1a0d;}
  .player-name{font-weight:700;font-size:.95rem;}
  .player-meta{font-size:.75rem;color:var(--muted);}
  .view-btn{background:var(--felt);color:var(--white);border:none;border-radius:8px;padding:8px 12px;font-size:.8rem;font-weight:700;cursor:pointer;}
  .view-btn:disabled{background:#2a332e;color:#5c655f;cursor:not-allowed;}

  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.85rem;}
  .status-grid div{background:#10140f;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
  .status-grid .label{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;}
  .status-grid .value{font-weight:700;}

  .winner-banner{text-align:center;color:var(--gold);font-weight:800;font-size:1.1rem;padding:10px 0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--panel);border-radius:14px;padding:20px;max-width:360px;width:100%;border:1px solid #262e29;max-height:80vh;overflow-y:auto;}
  .modal p{font-size:.95rem;margin-top:0;}
  .modal .btn-row{margin-top:14px;}
  .modal h3{margin:0 0 14px;text-align:center;color:var(--gold);}
  .btn-row{display:flex;gap:10px;}

  .pin-input{width:100%;padding:16px;font-size:1.6rem;text-align:center;letter-spacing:10px;border-radius:10px;border:1px solid #303a33;background:#10140f;color:var(--white);}
  .pin-error{color:var(--red);font-size:.8rem;text-align:center;min-height:1.1em;margin-top:8px;}

  .hand-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px;}
  .mini-card{width:46px;height:64px;background:var(--white);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;box-shadow:0 2px 5px rgba(0,0,0,.4);}
  .mini-card.red{color:var(--red);}
  .mini-card.black{color:var(--black);}
  .mini-card .suit{font-size:1.1rem;}

  .empty-state{text-align:center;color:var(--muted);padding:40px 10px;font-size:.9rem;line-height:1.6;}

  footer{text-align:center;font-size:.68rem;color:#555;padding-top:4px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <p id="confirmText">Are you sure?</p>
    <div class="btn-row">
      <button class="btn-secondary" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary" id="confirmOk" style="flex:1;">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pinOverlay">
  <div class="modal">
    <h3 id="pinTitle">Enter PIN</h3>
    <input class="pin-input" id="pinInput" type="tel" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="pin-error" id="pinError"></div>
    <div class="btn-row">
      <button class="btn-secondary" id="pinCancel">Cancel</button>
      <button class="btn btn-primary" id="pinSubmit" style="flex:1;">Unlock</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="handOverlay">
  <div class="modal">
    <h3 id="handTitle">Player</h3>
    <div class="hand-grid" id="handGrid"></div>
    <button class="btn btn-primary" id="hideHandBtn">HIDE CARDS</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const BALL_COLORS = ["#e8c93a","#2d5fd6","#d13c3c","#7b3fbf","#e8791f","#1f8a4c","#8a1f2b","#111111"];
  function ballColor(n){ return BALL_COLORS[(n-1)%8]; }
  function ballIsStripe(n){ return n > 8; }
  function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  const STORAGE_KEY = "billiardGameState";
  const app = document.getElementById("app");

  let numPlayers = 0, pins = [], names = [], hands = [], ballSunk = [], winnerIndex = null;

  // ---- confirm modal ----
  const confirmOverlay = document.getElementById("confirmOverlay");
  const confirmText = document.getElementById("confirmText");
  let pendingConfirmAction = null;
  document.getElementById("confirmCancel").addEventListener("click", () => {
    confirmOverlay.classList.remove("show"); pendingConfirmAction = null;
  });
  document.getElementById("confirmOk").addEventListener("click", () => {
    if(pendingConfirmAction) pendingConfirmAction();
    confirmOverlay.classList.remove("show"); pendingConfirmAction = null;
  });
  function askConfirm(msg, action){
    confirmText.textContent = msg;
    pendingConfirmAction = action;
    confirmOverlay.classList.add("show");
  }

  // ---- pin modal ----
  const pinOverlay = document.getElementById("pinOverlay");
  const pinTitle = document.getElementById("pinTitle");
  const pinInput = document.getElementById("pinInput");
  const pinError = document.getElementById("pinError");
  let pinOnSuccess = null;
  document.getElementById("pinCancel").addEventListener("click", closePin);
  document.getElementById("pinSubmit").addEventListener("click", submitPin);
  pinInput.addEventListener("keydown", e => { if(e.key === "Enter") submitPin(); });
  function openPin(title, onSuccess){
    pinTitle.textContent = title;
    pinInput.value = "";
    pinError.textContent = "";
    pinOnSuccess = onSuccess;
    pinOverlay.classList.add("show");
    setTimeout(() => pinInput.focus(), 50);
  }
  function closePin(){
    pinOverlay.classList.remove("show");
    pinOnSuccess = null;
  }
  function submitPin(){
    const val = pinInput.value.trim();
    if(val.length !== 4){
      pinError.textContent = "Enter a 4-digit PIN";
      return;
    }
    if(pinOnSuccess){
      const ok = pinOnSuccess(val);
      if(ok === false){
        pinError.textContent = "Incorrect PIN";
        pinInput.value = "";
        pinInput.focus();
      } else {
        closePin();
      }
    }
  }

  // ---- hand reveal modal ----
  const handOverlay = document.getElementById("handOverlay");
  const handTitle = document.getElementById("handTitle");
  const handGrid = document.getElementById("handGrid");
  document.getElementById("hideHandBtn").addEventListener("click", () => {
    handOverlay.classList.remove("show");
  });
  function openHand(playerName, hand){
    handTitle.textContent = playerName + "'s Hand";
    handGrid.innerHTML = "";
    if(hand.length === 0){
      handGrid.innerHTML = "<div style='color:var(--muted);padding:10px;'>No cards left</div>";
    }
    hand.forEach(c => {
      const mc = document.createElement("div");
      mc.className = "mini-card " + (c.color === 1 ? "red" : "black");
      mc.innerHTML = "<div>" + c.label + "</div><div class='suit'>" + c.suit + "</div>";
      handGrid.appendChild(mc);
    });
    handOverlay.classList.add("show");
  }

  // ---- state load / save ----
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const s = JSON.parse(raw);
      if(!s.inGame) return false;
      numPlayers = s.numPlayers; pins = s.pins; names = s.names;
      hands = s.hands; ballSunk = s.ballSunk; winnerIndex = s.winnerIndex;
      return true;
    }catch(e){ return false; }
  }
  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        numPlayers, pins, names, hands, ballSunk, winnerIndex, inGame: true
      }));
    }catch(e){ /* ignore */ }
  }
  window.addEventListener("storage", (e) => {
    if(e.key !== STORAGE_KEY) return;
    render();
  });

  function sinkBall(n){
    if(ballSunk[n] || winnerIndex !== null) return;
    ballSunk[n] = true;
    hands.forEach(hand => {
      for(let i = hand.length - 1; i >= 0; i--){
        if(hand[i].ball === n) hand.splice(i, 1);
      }
    });
    for(let p = 0; p < hands.length; p++){
      if(hands[p].length === 0 && winnerIndex === null){
        winnerIndex = p;
        break;
      }
    }
    saveState();
    render();
  }

  function render(){
    if(!loadState()){
      app.innerHTML =
        '<header><h1>BILLIARD CARD GAME</h1><p>PLAYER VIEW</p></header>' +
        '<div class="panel"><div class="empty-state">No game in progress yet.<br>Ask the host to deal a game on the admin page, then reload this page.</div></div>' +
        '<footer>Fully offline · No data leaves this device</footer>';
      return;
    }

    app.innerHTML =
      '<header><h1>BILLIARD CARD GAME</h1><p>PASS THE PHONE — ENTER YOUR PIN TO VIEW</p></header>' +
      (winnerIndex !== null ?
        '<div class="panel"><div class="winner-banner">\uD83C\uDFC6 ' + escapeHtml(names[winnerIndex]) + ' WINS!</div></div>' : '') +
      '<div class="panel">' +
        '<div class="section-title">Ball Rack — tap when a ball is sunk</div>' +
        '<div class="balls-rack" id="ballsRack"></div>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="status-grid">' +
          '<div><span class="label">Players</span><span class="value">' + numPlayers + '</span></div>' +
          '<div><span class="label">Balls Sunk</span><span class="value">' + ballSunk.filter(Boolean).length + ' / 15</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="section-title">Players — enter your PIN to view your hand</div>' +
        '<div class="players-list" id="playersList"></div>' +
      '</div>' +
      '<footer>Fully offline · PINs are stored only in this browser</footer>';

    const rack = document.getElementById("ballsRack");
    for(let n = 1; n <= 15; n++){
      const div = document.createElement("div");
      const isSunk = ballSunk[n];
      div.className = "ball " + (ballIsStripe(n) ? "stripe" : "solid") + (isSunk ? " sunk" : "");
      div.style.setProperty("--bc", ballColor(n));
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = n;
      div.appendChild(num);
      if(!isSunk && winnerIndex === null){
        div.addEventListener("click", () => {
          askConfirm("Sink ball " + n + "? This discards it from every hand that holds it.", () => sinkBall(n));
        });
      }
      rack.appendChild(div);
    }

    const list = document.getElementById("playersList");
    for(let p = 0; p < numPlayers; p++){
      const row = document.createElement("div");
      row.className = "player-row" + (winnerIndex === p ? " winner" : "");
      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "player-name";
      name.textContent = names[p] + (winnerIndex === p ? " 🏆" : "");
      const meta = document.createElement("div");
      meta.className = "player-meta";
      meta.textContent = hands[p].length + " card" + (hands[p].length === 1 ? "" : "s") + " remaining";
      left.appendChild(name);
      left.appendChild(meta);
      const btn = document.createElement("button");
      btn.className = "view-btn";
      btn.textContent = "VIEW";
      btn.disabled = hands[p].length === 0;
      btn.addEventListener("click", () => {
        openPin(names[p] + "'s PIN", (val) => {
          if(val === pins[p]){
            openHand(names[p], hands[p]);
            return true;
          }
          return false;
        });
      });
      row.appendChild(left);
      row.appendChild(btn);
      list.appendChild(row);
    }
  }

  render();
  setInterval(render, 1500); // pick up changes made on the admin page
})();
</script>
</body>
</html>
